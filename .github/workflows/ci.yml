name: CI

# This repo had no GitHub Actions at all — every test run was manual. This adds the
# offline half automatically and keeps the live e2e opt-in.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: check + unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies in package.json (Node built-ins only) — no npm install needed.
      - name: Require/load every MCP tool
        run: npm run check
      - name: Unit tests (offline)
        run: npm test
